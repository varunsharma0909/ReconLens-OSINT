name: ReconLens verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline pytest suite and record exact count
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-summary.txt
      - name: Generate measured fictional demo benchmark
        run: |
          python tests/build_demo_benchmark.py | tee benchmark-summary.txt
          python tests/evaluate_osint.py tests/benchmark_demo_results.csv
      - name: Print measured demo benchmark rows
        run: cat tests/benchmark_demo_results.csv
      - name: Measure local HTTP demo response times
        run: |
          set -e
          python app.py > /tmp/reconlens-app.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID || true" EXIT
          sleep 3
          python tests/measure_performance.py --runs 2 | tee http-demo-performance.txt
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconlens-verification
          path: |
            pytest-summary.txt
            benchmark-summary.txt
            tests/benchmark_demo_results.csv
            http-demo-performance.txt
          if-no-files-found: warn
