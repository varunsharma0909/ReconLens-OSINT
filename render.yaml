# Phase 2 Render Blueprint. Review paid plan costs before creating resources.
services:
  - type: web
    name: reconlens-phase2-web
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ALLOW_LIVE_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: reconlens-phase2-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reconlens-phase2-cache
          property: connectionString
  - type: keyvalue
    name: reconlens-phase2-cache
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: reconlens-phase2-db
    plan: basic-256mb
    ipAllowList: []
